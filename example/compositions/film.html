        if (t < 1.3) return ZOOM.map((v, i) => lerp(v, ZOOM2[i], t / 1.3));
        if (t < 2.05) {
          const f = follow(heroAt(2.05));
          const u = eio((t - 1.3) / 0.75);
          return ZOOM2.map((v, i) => lerp(v, f[i], u));
        }
        if (t < 10.7) return follow(h);
        const f = follow(heroAt(10.7));
        const u = eio(clamp((t - 10.7) / 0.8));
        return f.map((v, i) => lerp(v, END[i], u));
      }

      // ---------- canvases ----------
      const BAYER = [
        [0, 32, 8, 40, 2, 34, 10, 42], [48, 16, 56, 24, 50, 18, 58, 26],
        [12, 44, 4, 36, 14, 46, 6, 38], [60, 28, 52, 20, 62, 30, 54, 22],
        [3, 35, 11, 43, 1, 33, 9, 41], [51, 19, 59, 27, 49, 17, 57, 25],
        [15, 47, 7, 39, 13, 45, 5, 37], [63, 31, 55, 23, 61, 29, 53, 21],
      ];
      const dctx = $("dither").getContext("2d");
      function drawDither(progress) {
        dctx.clearRect(0, 0, 960, 64);
        if (progress <= 0) return;
        const cell = 8, cols = 120, rowsN = 8;
        for (let y = 0; y < rowsN; y++) {
          const depth = (y + 0.5) / rowsN;
          for (let x = 0; x < cols; x++) {
            const noise = hash(x, y, 4);
            const threshold = (BAYER[y % 8][x % 8] + 0.5) / 64;
            const value = depth * 1.6 - 0.3 + (noise - 0.5) * 0.5;
            const reveal = progress * 1.6 - (1 - value) * 0.6;
            if (value > threshold && reveal > noise * 0.4) dctx.fillStyle = "#0d0d10";
            else if (Math.abs(value - threshold) < 0.035 && noise > 0.55 && progress > 0.3) dctx.fillStyle = "#f04a00";
            else continue;
            dctx.fillRect(x * cell, y * cell, cell, cell);
          }
        }
      }
      const fctx = $("flood").getContext("2d");
      function drawFlood(p) {
        fctx.clearRect(0, 0, 960, 324);
        if (p <= 0) return;
        const cell = 12;
        const ox = 760, oy = 690 - 524;
        const maxD = Math.hypot(760, 324);
        fctx.fillStyle = "#f04a00";
        for (let y = 0; y < 27; y++) {
          for (let x = 0; x < 80; x++) {
            const d = Math.hypot(x * cell + 6 - ox, y * cell + 6 - oy) / maxD;
            if (d < p * 1.25 - hash(x, y, 9) * 0.25) fctx.fillRect(x * cell, y * cell, cell, cell);
          }
        }
      }

      // ---------- render one frame from time alone ----------
      function render(t) {
        const h = heroAt(t);

        // Hero transforms (no GSAP on these elements).
        $("hero").style.transform = `translate(${h.x}px, ${h.y}px)`;
        $("hero-size").style.transform = `scale(${h.size})`;
        $("hero-spin").style.transform = `rotate(${h.rot}deg)`;
        $("hero-body").style.transform = `scale(${h.sx}, ${h.sy})`;
        const [lx, ly] = keys(LOOK, t);
        let eye = t < 1.0 ? 0.08 : t < 1.12 ? lerp(0.08, 1, (t - 1.0) / 0.12) : 1;
        for (const b of BLINKS) if (Math.abs(t - b) < 0.06) eye = 0.12;
        $("hero-eyes").setAttribute("transform", `translate(${lx} ${ly + 10}) scale(1 ${eye}) translate(0 -10)`);
        $("hero-legs").style.opacity = t < 1.45 ? 0 : 1;
        // Outline switches on after the camouflage joke, with a short flicker.
        const ol = t < 8.9 ? 0 : t < 8.96 ? 1 : t < 9.0 ? 0 : 1;
        $("hero-outline").style.opacity = ol;

        // Camera.
        const [fx, fy, s] = camAt(t, h);
        $("cam").style.transform = `translate(${540 - s * fx}px, ${540 - s * fy}px) scale(${s})`;

        // Tab and address bar ship at the end.
        const shipped = t >= 10.75;
        $("tab-label").textContent = shipped ? "Solidinput" : "New Tab";
        $("url").innerHTML = shipped ? "https://www.<b>solidinput.eu</b>" : "localhost:3000";

        // The placeholder shatters as the hero crashes through it.
        const SHATTER = 1.93;
        const dt = t - SHATTER;
        todoChars.forEach((el, i) => {
          if (dt <= 0) { el.style.transform = "none"; return; }
          const vx = (hash(i, 1, 2) - 0.25) * 520;
          const vy = -(160 + hash(i, 2, 2) * 380);
          const r = (hash(i, 3, 2) - 0.5) * 900;
          el.style.transform = `translate(${vx * dt}px, ${vy * dt + 1300 * dt * dt}px) rotate(${r * dt}deg)`;
        });
        const fall = (el, k) => {
          el.style.transform = dt <= 0 ? "none"
            : `translate(${k * 120 * dt}px, ${-120 * dt + 1300 * dt * dt}px) rotate(${k * 40 * dt}deg)`;
        };
        fall($("todo-box"), 1);
        fall($("todo-note"), -1);

        // The floor line draws out from the landing.
        const fl = eout(clamp((t - 2.0) / 0.25));
        $("floor").style.transform = `scaleX(${fl})`;
        $("floor").style.transformOrigin = `${520 - 40}px 50%`;

        // Headline: lines 1-2 type on the stomp, line 3 drops in on the next landing.
        $("meta").style.opacity = clamp((t - 3.0) / 0.2);
        [...h1a, ...h1b].forEach((el, i) => {
          const d = t - (3.0 + i * 0.018);
          el.style.opacity = d < 0 ? 0 : 1;
          el.style.transform = d < 0 ? "none" : `scale(${d < 0.08 ? lerp(1.5, 1, d / 0.08) : 1})`;
        });
        h1c.forEach((el, i) => {
          const d = t - (4.0 + i * 0.022);
          el.style.opacity = d < 0 ? 0 : 1;
          el.style.transform = `translateY(${d < 0 ? -80 : -80 * (1 - bounceOut(clamp(d / 0.32)))}px)`;
          el.style.fontVariationSettings = `"ELSH" ${lerp(0, 50, clamp((d - 0.1) / 0.35))}`;
        });

        // Ground pound: dither seam, then the night band fills downward in 8px steps.
        drawDither(clamp((t - 5.0) / 0.45));
        const q = clamp((t - 5.2) / 0.3);
        const hidden = Math.ceil((210 * (1 - q)) / 8) * 8;
        $("night").style.clipPath = `inset(0 0 ${hidden}px 0)`;

        // Project rows light up as the hero lands in each.
        [6.0, 6.5, 7.0].forEach((lt, i) => {
          const d = t - lt;
          const row = rows[i];
          const dot = row.querySelector(".dot"), name = row.querySelector(".name"), tag = row.querySelector(".tag");
          dot.style.opacity = d < 0 ? 0 : 1;
          dot.style.transform = `scale(${d < 0 ? 0 : lerp(2.2, 1, eout(clamp(d / 0.15)))})`;
          name.style.opacity = d < 0 ? 0 : 1;
          name.style.transform = `translateX(${d < 0 ? -16 : -16 * (1 - eout(clamp(d / 0.2)))}px)`;
          name.style.fontVariationSettings = `"ELSH" ${lerp(0, 50, clamp(d / 0.4))}`;
          const dt2 = d - 0.12;
          tag.style.opacity = dt2 < 0 ? 0 : 1;
          tag.style.transform = `scale(${dt2 < 0 ? 0.6 : lerp(1.25, 1, eout(clamp(dt2 / 0.15)))})`;
        });

        // Orange flood from the landing point, then the question.
        drawFlood(clamp((t - 8.0) / 0.4));
        askChars.forEach((el, i) => {
          const d = t - (8.25 + i * 0.012);
          el.style.opacity = d < 0 ? 0 : 1;
          el.style.transform = `translateY(${d < 0 ? 12 : 12 * (1 - eout(clamp(d / 0.12)))}px)`;
        });

        // Skyline rises row by row, then its windows light up.
        const sk = clamp((t - 9.0) / 0.3);
        const rowsHidden = Math.round((1 - sk) * 64);
        $("sky").style.transform = `translateY(${rowsHidden * (226 / 64)}px)`;
        skyWindows.forEach((w, i) => {
          w.style.opacity = t >= 9.5 + windowRank[i] * 0.017 ? 1 : 0;
        });

        // End line.
        capWords.forEach((el, i) => {
          const d = t - (11.05 + i * 0.1);
          el.style.opacity = d < 0 ? 0 : 1;
          el.style.transform = `translateY(${d < 0 ? 20 : 20 * (1 - eout(clamp(d / 0.18)))}px)`;
          el.style.fontVariationSettings = `"ELSH" ${lerp(0, 50, clamp(d / 0.35))}`;
        });
        const ad = t - 11.9;
        $("arrow").style.opacity = ad < 0 ? 0 : 1;
        $("arrow").style.transform = `translateY(${ad < 0 ? -30 : -30 * (1 - bounceOut(clamp(ad / 0.4)))}px)`;
        $("cap-sub").style.opacity = clamp((t - 11.7) / 0.25);
      }

      // Drive everything from one paused GSAP tween, so every frame is a function of time.
      const clock = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(clock.t) }, 0);
      render(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["film"] = tl;
    })();
  </script>
</template>
