      <div id="hero">

                  <rect x="63" y="98" width="13" height="18" rx="3" />

                <g transform="scale(1.857) translate(-4 -4)">
                  <use href="#dfMark" />
                  <g id="hero-eyes">
                    <circle cx="25.5" cy="11.2" r="4.4" fill="#ffffff" />
                    <circle cx="38.5" cy="11.2" r="4.4" fill="#ffffff" />
                    <g id="hero-pupils" fill="#0F172A">
                      <circle cx="25.5" cy="11.4" r="2.2" />

    </svg>
    <div id="hook" class="outfit">
      <div>We gave our logo</div>
      <div class="amber">a job.</div>

      <div id="cap-sub">dinfirmaadresse.dk</div>

  <script>
    (function () {
      const DUR = 14;
      const $ = (id) => document.getElementById(id);

      // ---------- helpers ----------
      const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
      const lerp = (a, b, u) => a + (b - a) * u;
      const eio = (u) => (u < 0.5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2);
      const eout = (u) => 1 - Math.pow(1 - u, 3);
      const eback = (u) => { const c = 1.9; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };
      function hash(x, y, seed) {
        let h = (x * 374761393 + y * 668265263 + seed * 2246822519) | 0;
        h = Math.imul(h ^ (h >>> 13), 1274126177);
        return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
      }
      function bounceOut(u) {
        const n = 7.5625, d = 2.75;
        if (u < 1 / d) return n * u * u;
        if (u < 2 / d) return n * (u -= 1.5 / d) * u + 0.75;
        if (u < 2.5 / d) return n * (u -= 2.25 / d) * u + 0.9375;
        return n * (u -= 2.625 / d) * u + 0.984375;
      }
      function keys(list, t) {
        if (t <= list[0][0]) return list[0].slice(1);
        for (let i = 1; i < list.length; i++) {
          if (t <= list[i][0]) {
            const a = list[i - 1], b = list[i];
            const u = eio((t - a[0]) / (b[0] - a[0]));
            return a.slice(1).map((v, k) => lerp(v, b[k + 1], u));
          }
        }
        return list[list.length - 1].slice(1);
      }
      function splitChars(el, text) {
        el.innerHTML = "";
        return [...text].map((c) => {
          const s = document.createElement("span");
          s.className = "ch";
          s.textContent = c;
          el.appendChild(s);
          return s;
        });
      }
      const show = (el, on) => (el.style.opacity = on ? 1 : 0);

      // ---------- content ----------
      const skelChars = splitChars($("skel-text"), "Loading…");
      const emailChars = splitChars($("email"), "kontakt@dinfirmaadresse.dk");
      const pwChars = splitChars($("pw"), "••••••••••");
      const cap = $("cap-line");
      const capWords = ["Your ", "post, ", "handled."].map((w, i) => {
        const s = document.createElement("span");
        s.className = "ch" + (i === 2 ? " amber" : "");
        s.textContent = w;
        cap.appendChild(s);
        return s;
      });
      const rows = [0, 1, 2, 3].map((i) => $("row-" + i));
      const cells = [0, 1, 2].map((i) => $("cell-" + i));
      const navs = [0, 1, 2, 3, 4].map((i) => $("nav-" + i));

      // ---------- the hero's path ----------
      // Frame pixels. The page viewport starts at frame (70, 436).
      const V = (x, y) => ({ x: 70 + x, y: 436 + y });
      const TAB = { x: 193, y: 376 };
      const SMALL = 0.212;
      const PAGE = 0.8;
      const CARD = V(470, 110);
      const EMAIL = V(690, 338);
      const PASS = V(690, 468);
      const BTN = V(470, 590);
      const NAV_MAIL = V(240, 284);
      const ROW = [V(790, 570), V(790, 700), V(790, 830), V(790, 960)];
      const NAV_BILL = V(240, 412);
      const INV_TOP = V(720, 450);
      const STAMP = V(700, 780);
      const STATUS = V(845, 196);

      // Frame 0 (the thumbnail): the mark stands big under the hook line; camera is at Z2 (330, 560, x2).
      const HOOK = { x: 330, y: 705 };
      const BIG = 2.69;
      const HOPS = [
        { t0: 0.95, t1: 1.4, a: HOOK, b: TAB, h: 60, s0: BIG, s1: SMALL, sOut: true },
        { t0: 1.5, t1: 2.0, a: TAB, b: CARD, h: 300, s0: SMALL, s1: PAGE, crouch: 0.09 },
        { t0: 2.1, t1: 2.5, a: CARD, b: EMAIL, h: 110 },
        { t0: 2.6, t1: 3.0, a: EMAIL, b: PASS, h: 90 },
        { t0: 3.5, t1: 4.0, a: PASS, b: BTN, h: 260, spin: -360 },
        { t0: 4.1, t1: 4.5, a: BTN, b: NAV_MAIL, h: 170 },
        { t0: 4.6, t1: 5.0, a: NAV_MAIL, b: ROW[0], h: 180 },
        { t0: 5.1, t1: 5.5, a: ROW[0], b: ROW[1], h: 90 },
        { t0: 5.6, t1: 6.0, a: ROW[1], b: ROW[2], h: 90 },
        { t0: 6.1, t1: 6.5, a: ROW[2], b: ROW[3], h: 90 },
        { t0: 7.6, t1: 8.0, a: ROW[3], b: NAV_BILL, h: 220 },
        { t0: 8.1, t1: 8.5, a: NAV_BILL, b: INV_TOP, h: 150 },
        { t0: 8.6, t1: 9.0, a: INV_TOP, b: STAMP, h: 240, spin: -360 },
        { t0: 9.5, t1: 10.0, a: STAMP, b: STATUS, h: 200 },
        { t0: 10.45, t1: 11.0, a: STATUS, b: TAB, h: 170, s0: PAGE, s1: SMALL, spin: 360 },
      ];
      const BLINKS = [0.5, 1.75, 3.25, 4.8, 7.12, 7.32, 9.3, 10.3, 12.4, 13.2];
      // Pupil offsets in mark units.
      const LOOK = [
        [0, 0, 0], [1.05, 0, 0], [1.15, 1.6, 0.6], [1.35, 1.6, 0.6], [1.45, 0, 0],
        [2.55, 0, 0], [2.65, -1.8, 1.2], [2.95, -1.8, 1.2], [3.05, -1.8, 1.2], [3.4, -1.8, 1.2], [3.5, 0, 0],
        [6.55, 0, 0], [6.62, 0, -1.4], [6.98, 0, 1.4], [7.08, -2, 0.8], [7.5, -2, 0.8], [7.58, 0, 0],
        [9.12, 0, 0], [9.22, -1.4, 1.5], [9.45, -1.4, 1.5], [9.52, 0, 0],
        [10.05, 0, 0], [10.12, -1.8, 1.4], [10.4, -1.8, 1.4], [10.45, 0, 0],
      ];

      function heroAt(t) {
        let x = HOOK.x, y = HOOK.y, gy = HOOK.y, size = BIG, rot = 0, sy = 1;
        let lastLand = -9, next = null, air = null;
        for (const h of HOPS) {
          if (t >= h.t1) { lastLand = h.t1; x = h.b.x; y = gy = h.b.y; size = h.s1 ?? size; }
          else if (t >= h.t0) { air = h; break; }
          else { next = h; break; }
        }
        if (air) {
          const u = (t - air.t0) / (air.t1 - air.t0);
          x = lerp(air.a.x, air.b.x, u);
          y = lerp(air.a.y, air.b.y, u) - air.h * 4 * u * (1 - u);
          gy = lerp(air.a.y, air.b.y, eio(u));
          size = lerp(air.s0 ?? size, air.s1 ?? size, air.sOut ? eout(u) : eio(u));
          rot = (air.spin || 0) * eio(u);
          sy *= 1 + 0.18 * Math.max(0, 1 - u / 0.35) + 0.1 * Math.max(0, (u - 0.75) / 0.25);
        }
        const d = t - lastLand;
        const hard = lastLand === 4.0 || lastLand === 9.0;
        if (d >= 0 && d < 0.7) sy *= 1 - (hard ? 0.38 : 0.28) * Math.exp(-d * 7) * Math.cos(d * 26);
        if (next) {
          const win = next.crouch || 0.1;
          const a = next.t0 - t;
          if (a > 0 && a < win) { const k = 1 - a / win; sy *= 1 - 0.24 * k * k; }
        }
        // Knocks against the tab, on the first two beats.
        for (const b of [0.25, 0.75]) {
          const q = t - b + 0.14;
          if (q > 0 && q < 0.28) rot = 16 * Math.sin((q / 0.28) * Math.PI * 4) * (1 - q / 0.28);
        }
        // Shiver while the scanner passes.
        if (t > 6.6 && t < 7.0) x += 1.6 * Math.sin(t * 140);
        return { x, y, gy, size, rot, sy, sx: Math.pow(sy, -0.6) };
      }

      // ---------- camera ----------
      // Reels covers the top ~14 % and the bottom ~35 %: keep the action near y 700-1060.
      function follow(h) {
        return [540 + 0.12 * (h.x - 540), 960 + 0.55 * (h.gy + 170 - 960), 1.0];
      }
      function camAt(t, h) {
        const Z1 = [330, 620, 1.9];
        const Z2 = [330, 560, 2.0];
        const END = [540, 854, END_S];
        let c;
        if (t < 1.5) c = Z2.slice();
        else if (t < 2.05) {
          const f = follow(heroAt(2.05));
          const u = eio((t - 1.5) / 0.55);
          c = Z2.map((v, i) => lerp(v, f[i], u));
        } else if (t < 11.0) c = follow(h);
        else {
          const f = follow(heroAt(11.0));
          const u = eio(clamp((t - 11.0) / 0.8));
          c = f.map((v, i) => lerp(v, END[i], u));
        }
        // Small shakes on the two hard stamps.
        for (const s of [4.0, 9.0]) {
          const d = t - s;
          if (d > 0 && d < 0.35) c[1] += 7 * Math.sin(d * 70) * Math.exp(-d * 12);
        }
        return c;
      }

      // ---------- render one frame from time alone ----------
      function render(t) {
        const h = heroAt(t);
        $("hero").style.transform = `translate(${h.x}px, ${h.y}px)`;
        $("hero-size").style.transform = `scale(${h.size})`;
        $("hero-spin").style.transform = `rotate(${h.rot}deg)`;
        $("hero-body").style.transform = `scale(${h.sx}, ${h.sy})`;
        const [lx, ly] = keys(LOOK, t);
        $("hero-pupils").setAttribute("transform", `translate(${lx} ${ly})`);
        let eye = 1;
        if (t > 6.6 && t < 7.0) eye = 0.35; // squint under the scanner
        for (const b of BLINKS) if (Math.abs(t - b) < 0.06) eye = 0.1;
        $("hero-eyes").setAttribute("transform", `translate(0 11.2) scale(1 ${eye}) translate(0 -11.2)`);
        $("hero-legs").style.opacity = t >= 11.0 ? 0 : 1;

        // Hook: the line leaves as the browser rises in behind the hero.
        const hk = clamp((t - 1.3) / 0.18);
        $("hook").style.opacity = 1 - hk;
        $("hook").style.transform = `translateY(${-50 * eout(hk)}px)`;
        const wn = clamp((t - 0.9) / 0.35);
        $("win").style.opacity = wn;
        $("win").style.transform = `translateY(${70 * (1 - eout(wn))}px)`;

        const [fx, fy, s] = camAt(t, h);
        $("cam").style.transform = `translate(${540 - s * fx}px, ${960 - s * fy}px) scale(${s})`;

        // Tab and address bar follow the page.
        const label = t < 4.0 ? "Log in" : t < 4.5 ? "Overview" : t < 8.0 ? "My Mail" : t < 11.0 ? "Your invoices" : "Din Firmaadresse";
        $("tab-label").textContent = label;
        const path = t < 4.0 ? "/en/login" : t < 4.5 ? "/en/dashboard" : t < 8.0 ? "/en/dashboard/post" : "/en/dashboard/fakturaer";
        $("url").innerHTML = `<b>dinfirmaadresse.dk</b>${path}`;
        const bd = t - 11.0;
        $("tab-badge").style.opacity = bd < 0 ? 0 : 1;
        $("tab-badge").style.transform = `scale(${bd < 0 ? 0 : lerp(1.8, 1, eout(clamp(bd / 0.2)))})`;

        // ----- placeholder shatters -----
        const SH = 1.93, dt = t - SH;
        skelChars.forEach((el, i) => {
          if (dt <= 0) { el.style.transform = "none"; return; }
          const vx = (hash(i, 1, 2) - 0.4) * 640;
          const vy = -(220 + hash(i, 2, 2) * 420);
          const r = (hash(i, 3, 2) - 0.5) * 900;
          el.style.transform = `translate(${vx * dt}px, ${vy * dt + 1500 * dt * dt}px) rotate(${r * dt}deg)`;
        });
        ["skel-card", "bone-0", "bone-1", "bone-2", "bone-3"].forEach((id, k) => {
          const el = $(id);
          const dir = k % 2 ? 1 : -1;
          el.style.transform = dt <= 0 ? "none"
            : `translate(${dir * (60 + k * 40) * dt}px, ${-(80 + k * 30) * dt + 1500 * dt * dt}px) rotate(${dir * (12 + k * 6) * dt}deg)`;
        });
        $("skel").style.display = t > 3.2 ? "none" : "block";

        // ----- login card -----
        const ld = t - 2.0;
        const loginOn = ld >= 0 && t < 4.45;
        $("login").style.opacity = loginOn ? clamp(ld / 0.12) : 0;
        $("login").style.transform = `scale(${ld < 0 ? 0.94 : lerp(0.94, 1, eback(clamp(ld / 0.3)))})`;
        emailChars.forEach((el, i) => show(el, t >= 2.5 + i * 0.018));
        pwChars.forEach((el, i) => show(el, t >= 3.0 + i * 0.035));
        const bp = t - 4.0;
        $("btn").style.transform = `scaleY(${bp < 0 ? 1 : 1 - 0.14 * Math.exp(-bp * 10) * Math.max(0, Math.cos(bp * 18))})`;
        $("btn").style.background = bp >= 0 && bp < 0.3 ? "#1e293b" : "";

        // ----- dashboard reveal: a circle from the button -----
        const r = t < 4.0 ? 0 : eout(clamp((t - 4.0) / 0.45)) * 1500;
        $("dash").style.clipPath = `circle(${r}px at 470px 630px)`;
        $("dash").style.visibility = t < 4.0 ? "hidden" : "visible";

        // Sidebar marker.
        const NAVY = [164, 228, 356];
        const MK = [[4.0, 0], [4.5, 0], [4.62, 1], [8.0, 1], [8.12, 2]];
        const mk = keys(MK, t)[0];
        const ny = mk <= 1 ? lerp(NAVY[0], NAVY[1], mk) : lerp(NAVY[1], NAVY[2], mk - 1);
        $("nav-hi").style.top = `${ny}px`;
        $("nav-bar").style.top = `${ny + 12}px`;
        const active = t < 4.5 ? 0 : t < 8.0 ? 1 : 3;
        navs.forEach((n, i) => n.classList.toggle("on", i === active));

        // Status checks.
        [10.0, 10.12, 10.24].forEach((ct, i) => {
          const d = t - ct;
          const ico = cells[i].querySelector(".ico");
          const v = cells[i].querySelector(".v");
          ico.style.background = d < 0 ? "" : "var(--green)";
          ico.style.borderColor = d < 0 ? "" : "var(--green)";
          ico.style.transform = `scale(${d < 0 ? 1 : lerp(1.5, 1, eout(clamp(d / 0.18)))})`;
          ico.querySelector("svg").style.opacity = d < 0 ? 0 : 1;
          v.style.opacity = d < 0 ? 0.25 : 1;
        });

        // ----- mailbox panel -----
        const mailOn = t < 8.06;
        $("p-mail").style.opacity = t < 8.0 ? 1 : 1 - clamp((t - 8.0) / 0.06);
        $("p-mail").style.transform = `translateX(${t < 8.0 ? 0 : -30 * eout(clamp((t - 8.0) / 0.06))}px)`;
        $("p-mail").style.visibility = mailOn ? "visible" : "hidden";
        $("empty").style.opacity = t < 4.98 ? 1 : 0;
        // Letters land with the hero, one per beat.
        [5.0, 5.5, 6.0].forEach((lt, i) => {
          const d = t - (lt - 0.12);
          const row = rows[i];
          row.style.opacity = d < 0 ? 0 : 1;
          row.style.transform = `translateY(${d < 0 ? -90 : -90 * (1 - bounceOut(clamp(d / 0.3)))}px)`;
          // The pill shows when the hero hops on.
          const pd = t - (lt + 0.12);
          const pill = row.querySelector(".pill");
          pill.style.opacity = pd < 0 ? 0 : 1;
          pill.style.transform = `scale(${pd < 0 ? 0.6 : lerp(1.3, 1, eout(clamp(pd / 0.15)))})`;
        });
        // Row 4: the hero gets scanned.
        const r3 = rows[3];
        r3.style.opacity = t < 6.5 ? 0 : 1;
        const content = [...r3.querySelectorAll(".tile, .who, .what")];
        content.forEach((el, k) => {
          const d = t - (7.0 + k * 0.06);
          el.style.opacity = d < 0 ? 0 : 1;
          el.style.transform = `translateX(${d < 0 ? -14 : -14 * (1 - eout(clamp(d / 0.18)))}px)`;
        });
        $("row3-wash").style.opacity = t < 6.6 ? 0 : t < 7.0 ? 1 : Math.max(0, 1 - (t - 7.0) / 0.5);
        const p3 = r3.querySelector(".pill"), pd3 = t - 7.7;
        p3.style.opacity = pd3 < 0 ? 0 : 1;
        p3.style.transform = `scale(${pd3 < 0 ? 0.6 : lerp(1.3, 1, eout(clamp(pd3 / 0.15)))})`;
        // The scanner light sweeps down over the hero (frame coords of row 4).
        const sc = $("scan");
        const su = (t - 6.6) / 0.4;
        const rowTop = 436 + 320 + 510, rowLeft = 70 + 302;
        sc.style.opacity = su < 0 || su > 1 ? 0 : 1;
        sc.style.left = `${rowLeft + 8}px`;
        sc.style.width = `${578 - 16}px`;
        sc.style.top = `${rowTop + 6 + 118 * eio(clamp(su))}px`;

        // ----- billing panel -----
        const bt = t - 8.06;
        $("p-bill").style.visibility = bt < 0 ? "hidden" : "visible";
        $("p-bill").style.opacity = clamp(bt / 0.08);
        $("p-bill").style.transform = `translateX(${bt < 0 ? 40 : 40 * (1 - eout(clamp(bt / 0.2)))}px)`;
        const paid = t >= 9.04;
        const ip = $("inv-pill");
        ip.textContent = paid ? "Paid" : "Unpaid";
        ip.className = "pill " + (paid ? "ok" : "due");
        const pq = t - 9.04;
        ip.style.transform = `scale(${pq < 0 ? 1 : lerp(1.35, 1, eout(clamp(pq / 0.18)))})`;
        const sd = t - 9.0;
        const st = $("stamp");
        st.style.opacity = sd < 0 ? 0 : 0.92;
        st.style.transform = `rotate(-9deg) scale(${sd < 0 ? 1.6 : lerp(1.6, 1, eout(clamp(sd / 0.08)))})`;

        // ----- end line -----
        capWords.forEach((el, i) => {
          const d = t - (11.55 + i * 0.15);
          el.style.opacity = d < 0 ? 0 : 1;
          el.style.transform = `translateY(${d < 0 ? 26 : 26 * (1 - eback(clamp(d / 0.3)))}px) scale(${d < 0 ? 0.9 : lerp(0.9, 1, eout(clamp(d / 0.2)))})`;
        });
        $("cap-sub").style.opacity = clamp((t - 11.9) / 0.2);
        // Arrow drops onto the tab icon (frame position after the pull-back).
        const tabF = { x: 540 + END_S * (TAB.x - 540), y: 960 + END_S * (TAB.y - 23 - 854) };
        const ad = t - 12.35;
        const ar = $("arrow");
        ar.style.left = `${tabF.x - 20}px`;
        ar.style.top = `${tabF.y - 64 - 6}px`;
        ar.style.opacity = ad < 0 ? 0 : 1;
        ar.style.transform = `translateY(${ad < 0 ? -40 : -40 * (1 - bounceOut(clamp(ad / 0.45)))}px)`;
      }
      const END_S = 0.82;

      const clock = { t: 0 };
      const tl = gsap.timeline({ paused: true });
      tl.fromTo(clock, { t: 0 }, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(clock.t) }, 0);
      render(0);
      window.__timelines = window.__timelines || {};
      window.__timelines["film"] = tl;
    })();
  </script>
</template>
